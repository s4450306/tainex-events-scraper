name: Run TaiNEX Scraper

on:
  schedule:
    - cron: '0 0 * * 1' # 每週一自動執行
  workflow_dispatch:     # 支援手動觸發

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pandas openpyxl requests

      - name: Run script
        run: python tainex_scraper.py

      - name: Commit and push updated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 將所有 Excel 與異動加入暫存
          git add *.xlsx || true
          git add -A
          
          # 檢查是否有未提交的變更，避免 exit code 128
          if git diff --cached --quiet; then
            echo "目前無資料變更，順利結束"
          else
            git commit -m "Auto-update exhibition Excel"
            git push origin HEAD:${{ github.ref_name }}
          fi
